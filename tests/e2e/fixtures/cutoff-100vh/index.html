<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  body { margin: 0; }
  .panel { height: 100vh; width: 100vw; box-sizing: border-box; }
  .panel--one { background: rgb(200, 40, 40); }
  .panel--two { background: rgb(40, 180, 90); }
  .panel--three { background: rgb(40, 90, 200); }
</style>
</head>
<body>
  <section class="panel panel--one"><h1>Slide 1</h1></section>
  <section class="panel panel--two"><h1>Slide 2</h1></section>
  <section class="panel panel--three"><h1>Slide 3</h1></section>
</body>
</html>
