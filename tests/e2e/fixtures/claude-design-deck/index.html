<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  body { margin: 0; font-family: sans-serif; }
  x-dc { display: block; }
  x-dc section { display: block; width: 800px; height: 400px; box-sizing: border-box; padding: 40px; }
</style>
</head>
<body>
  <!-- Estructura estilo Claude Design deck-stage: cada slide es un
       <section data-label data-screen-label> dentro de <x-dc>. -->
  <x-dc>
    <section data-label="Portada" data-screen-label="01" data-speaker-notes="Saludar y presentar el tema." style="background: rgb(20, 20, 40)">
      <h1 style="color: white">Portada del proyecto</h1>
    </section>
    <section data-label="Contenido" data-screen-label="02" data-speaker-notes="Explicar los tres puntos clave con calma." style="background: rgb(180, 70, 40)">
      <h1 style="color: white">Contenido principal</h1>
    </section>
    <section data-label="Cierre" data-screen-label="03" data-speaker-notes="Agradecer y abrir preguntas." style="background: rgb(40, 120, 80)">
      <h1 style="color: white">Cierre y preguntas</h1>
    </section>
  </x-dc>
</body>
</html>
