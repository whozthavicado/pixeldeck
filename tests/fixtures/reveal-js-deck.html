<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Deck de ejemplo — Reveal.js</title>
</head>
<body>

    <div class="slides">
      <section>
        <h1>Bienvenida</h1>
        <p>Slide 1 de un deck típico de Reveal.js</p>
      </section>
      <section>
        <h1>Contenido</h1>

          <li>Punto uno</li>
          <li>Punto dos</li>
        </ul>
      </section>
      <section>

      </section>
    </div>
  </div>
  <script src="reveal.js"></script>
</body>
</html>
