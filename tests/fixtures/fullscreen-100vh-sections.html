<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Deck de ejemplo — secciones 100vh (patrón típico de decks generados por IA)</title>
  <style>
    body { margin: 0; }
    .panel { height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; }
    .panel--intro { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; }
    .panel--content { background: #f4f1ea; }
    .panel--closing { background: #0d0d0d; color: white; }
  </style>
</head>
<body>
  <section class="panel panel--intro">
    <h1>Título de la presentación</h1>
  </section>
  <section class="panel panel--content">
    <h2>Desarrollo del tema</h2>
    <p>Contenido de la segunda pantalla completa.</p>
  </section>
  <section class="panel panel--closing">
    <h2>Conclusión</h2>
  </section>
</body>
</html>
