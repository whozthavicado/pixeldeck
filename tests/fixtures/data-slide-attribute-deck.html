<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Deck de ejemplo — atributo data-slide explícito</title>
</head>
<body>
  <div id="app">
    <!-- A propósito fuera de orden en el DOM, para probar el ordenamiento por índice explícito -->
    <div data-slide-index="2">
      <h1>Segunda diapositiva</h1>
    </div>
    <div data-slide-index="0">
      <h1>Primera diapositiva</h1>
    </div>
    <div data-slide-index="1">
      <h1>Diapositiva intermedia</h1>
    </div>
  </div>
</body>
</html>
