<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Deck de ejemplo — con hipervínculo</title>
  <style>
    body { margin: 0; }
    .panel { height: 100vh; width: 100vw; box-sizing: border-box; padding: 60px; font-family: sans-serif; }
    .panel--one { background: #eef; }
    .panel--two { background: #fee; }
    a.cta { display: inline-block; margin-top: 40px; padding: 16px 32px; background: #223; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <section class="panel panel--one">
    <h1>Slide con enlace</h1>
    <a class="cta" href="https://example.com/destino">Ir al destino</a>
  </section>
  <section class="panel panel--two">
    <h1>Slide sin enlaces</h1>
  </section>
</body>
</html>
