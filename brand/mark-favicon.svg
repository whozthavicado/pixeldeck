<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PixelDeck">
  <title>PixelDeck</title>
  <!--
    Variante para tamaños diminutos (favicon, 16-32 px). A esa escala la
    retícula de píxeles de mark.svg se convierte en ruido, así que aquí la
    progresión se cuenta SOLO con el tono y el escalonado: tres láminas
    sólidas, de más apagada a más brillante hacia el frente. Misma idea,
    resuelta con las formas mínimas que sobreviven a 16 px.
  -->
  <rect x="3" y="6" width="18" height="9" fill="#6b3a0d" />
  <rect x="7" y="12" width="18" height="9" fill="#bf6a15" />
  <rect x="11" y="18" width="18" height="9" fill="#ff9d2e" />
</svg>
